<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecorteAP</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>RecorteAP <small>1.2.6</small></h1></header>
<section><h2>Pasta de recortes</h2><button id="btnChooseFolder">Selecionar pasta</button><p id="folderPathDisplay" class="hint"></p></section>
<section><h2>Capturar seleção</h2><button id="btnFullWidth">Ativar letreiro retangular</button><button id="btnSync" class="primary">Capturar recorte</button></section>
<section><h2>Aplicar recortes editados</h2><label><input id="chkFixProfile" type="checkbox" checked> Converter para o perfil da página</label><label for="matchStrength">Aproximar brilho e cores do original (%)</label><input id="matchStrength" type="number" min="0" max="100" step="10" value="0"><button id="btnApplyAll" class="primary">Aplicar todos os pendentes</button><progress id="progress" max="100" value="0"></progress><button id="btnCancel" hidden>Parar após este recorte</button></section>
<section><h2>Histórico</h2><div class="toolbar"><button id="btnRefresh">Verificar arquivos</button><button id="btnImport">Importar da pasta</button><button id="btnSaveCoords">Salvar coordenadas</button><button id="btnClearHistory">Excluir só aplicados</button><button id="btnDeleteAll">Excluir todos e arquivos</button></div><div id="historyList"></div></section>
<button id="btnRecover" disabled>Verificar comunicação</button><p id="status" role="status" aria-live="polite">Conectando…</p><script src="main.js"></script></body></html>
